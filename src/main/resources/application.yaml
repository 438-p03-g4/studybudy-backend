spring:
  application:
    name: backend
  servlet:
    session:
      cookie:
        # Lax is suitable for local same-site testing; set None + Secure when
        # the frontend and API use different sites (for example, localhost + Render).
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
        secure: ${SESSION_COOKIE_SECURE:false}
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - read:user
              - user:email

app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:8081}
  frontend-success-url: ${FRONTEND_SUCCESS_URL:http://localhost:8081/login/success}
