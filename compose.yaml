name: studybuddy-onboarding

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: studybuddy
      POSTGRES_USER: studybuddy
      POSTGRES_PASSWORD: ${LOCAL_DATABASE_PASSWORD:-studybuddy_local_only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studybuddy -d studybuddy"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - local-postgres:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:10000"
    environment:
      PORT: "10000"
      DATABASE_URL: jdbc:postgresql://db:5432/studybuddy
      DATABASE_USERNAME: studybuddy
      DATABASE_PASSWORD: ${LOCAL_DATABASE_PASSWORD:-studybuddy_local_only}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-onboarding-not-a-real-client}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-onboarding-not-a-real-secret}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-onboarding-not-a-real-client}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-onboarding-not-a-real-secret}
      FRONTEND_ORIGIN: http://localhost:8081
      FRONTEND_SUCCESS_URL: http://localhost:8081
    depends_on:
      db:
        condition: service_healthy

  tests:
    profiles: [test]
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    command: ["./gradlew", "--no-daemon", "test", "--console=plain"]

volumes:
  local-postgres:
