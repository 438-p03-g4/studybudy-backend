openapi: 3.0.3
info:
  title: StudyBuddy API
  version: 0.1.0
  description: |
    Study group discovery for the Find Study Groups client page.
tags:
  - name: Groups
    description: Study group discovery and search.
paths:
  /groups:
    get:
      tags: [Groups]
      operationId: searchGroupsByCourse
      summary: Find study groups
      description: |
        Requires a valid StudyBuddy-issued bearer JWT.
        With no query, returns up to 20 groups in randomized order.
        With a query, matches group names or course values case-insensitively
        using a partial-text search.
      security:
        - bearerAuth: []
      parameters:
        - name: query
          in: query
          required: false
          description: Optional text to match against group name or course.
          schema:
            type: string
          example: backend
        - name: course
          in: query
          required: false
          description: Deprecated exact-course filter retained for compatibility.
          schema:
            type: string
          example: CST438
      responses:
        '200':
          description: Matching groups; an empty array when no groups match.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudyGroupSummary'
              examples:
                matchingGroups:
                  summary: A matching group
                  value:
                    - id: 1
                      name: CST438 Study Group
                      course: CST438
                noMatches:
                  summary: No matching groups
                  value: []
        '401':
          description: The bearer token is missing, invalid, or expired.
          headers:
            WWW-Authenticate:
              description: Bearer authentication challenge.
              schema:
                type: string
              example: Bearer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: A valid StudyBuddy bearer token is required.
                instance: /groups
    post:
      tags: [Groups]
      operationId: createStudyGroup
      summary: Open a study group
      description: Creates a group and adds the authenticated user as its first member with the OWNER role.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStudyGroupRequest'
      responses:
        '201':
          description: The study group was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyGroupSummary'
        '400':
          description: A required field is blank or a field exceeds its maximum length.
        '401':
          description: The authenticated user is missing or could not be found.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued by the StudyBuddy API after Google or GitHub sign-in.
  schemas:
    StudyGroupSummary:
      type: object
      description: Proposed shared group fields; review with the group creation owner.
      required: [id, name, course]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: Unique group identifier.
          example: 1
        name:
          type: string
          minLength: 1
          description: Display name of the group.
          example: CST438 Study Group
        course:
          type: string
          minLength: 1
          description: Course identifier associated with the group.
          example: CST438
        iconUrl:
          type: string
          nullable: true
          maxLength: 500
          description: Optional image URL for the group icon.
        description:
          type: string
          nullable: true
          maxLength: 1000
          description: Optional description of the group.
    CreateStudyGroupRequest:
      type: object
      required: [name, course]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        course:
          type: string
          minLength: 1
          maxLength: 40
        iconUrl:
          type: string
          maxLength: 500
        description:
          type: string
          maxLength: 1000
    Problem:
      type: object
      description: RFC 9457 Problem Details error response.
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri-reference
          example: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
