openapi: 3.0.3

info:
  title: StudyBuddy API
  version: 0.1.0
  description: |
    API contract for study group search (PRD-7) and creation (PRD-6).
    Joining groups and My Groups are defined in separate issues.

tags:
  - name: Groups
    description: Course-specific study groups.

paths:
  /groups:
    post:
      tags: [Groups]
      operationId: createStudyGroup
      summary: Create a study group
      description: |
        Requires a valid StudyBuddy-issued bearer JWT.
        Leading and trailing whitespace is removed before saving.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStudyGroupRequest'
            example:
              name: CST438 Study Group
              course: CST438
      responses:
        '201':
          description: Study group created and persisted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyGroupSummary'
              example:
                id: 1
                name: CST438 Study Group
                course: CST438
        '400':
          description: Missing, blank, oversized, or malformed input.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Bad Request
                status: 400
                detail: The group name and course must not be blank.
                instance: /groups
        '401':
          $ref: '#/components/responses/Unauthorized'

    get:
      tags: [Groups]
      operationId: searchGroupsByCourse
      summary: Find study groups by course
      description: |
        Requires a valid StudyBuddy-issued bearer JWT.
        Trim surrounding whitespace from the course parameter and compare the
        full course value case-insensitively; this is not a substring search.
        Missing, empty, or whitespace-only course values return 400.
        Matching groups are ordered by ID ascending for stable results.
      security:
        - bearerAuth: []
      parameters:
        - name: course
          in: query
          required: true
          description: Course identifier to match, for example CST438.
          schema:
            type: string
            minLength: 1
            pattern: '\S'
          example: CST438
      responses:
        '200':
          description: Matching groups; an empty array when no groups match.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudyGroupSummary'
              examples:
                matchingGroups:
                  summary: A matching group
                  value:
                    - id: 1
                      name: CST438 Study Group
                      course: CST438
                noMatches:
                  summary: No matching groups
                  value: []
        '400':
          description: The course parameter is missing or blank.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Bad Request
                status: 400
                detail: The course query parameter must not be blank.
                instance: /groups
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued by the StudyBuddy API after Google or GitHub sign-in.

  responses:
    Unauthorized:
      description: The bearer token is missing, invalid, or expired.
      headers:
        WWW-Authenticate:
          description: Bearer authentication challenge.
          schema:
            type: string
          example: Bearer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            detail: A valid StudyBuddy bearer token is required.
            instance: /groups

  schemas:
    CreateStudyGroupRequest:
      type: object
      description: |
        Group name and course identifier.
        Length limits apply to the submitted strings.
        Surrounding whitespace is removed before persistence.
      required: [name, course]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '\S'
          description: Group name containing at least one non-whitespace character.
          example: CST438 Study Group
        course:
          type: string
          minLength: 1
          maxLength: 40
          pattern: '\S'
          description: Course identifier containing at least one non-whitespace character.
          example: CST438

    StudyGroupSummary:
      type: object
      description: Group fields returned by creation and search.
      required: [id, name, course]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: Unique group identifier.
          example: 1
        name:
          type: string
          minLength: 1
          description: Display name of the group.
          example: CST438 Study Group
        course:
          type: string
          minLength: 1
          description: Course identifier associated with the group.
          example: CST438

    Problem:
      type: object
      description: RFC 9457 Problem Details error response.
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri-reference
          example: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
