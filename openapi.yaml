openapi: 3.0.3

info:
  title: StudyBuddy API
  version: 0.1.0
  description: |
    API contract for study group search (PRD-7) and creation (PRD-6).
    Authentication currently uses the existing OAuth2 login session.
    StudyBuddy bearer JWT integration is tracked separately in issue #19.

tags:
  - name: Groups
    description: Study group discovery and creation.

paths:
  /groups:
    get:
      tags: [Groups]
      operationId: searchGroupsByCourse
      summary: Find study groups
      description: |
        With a non-blank query, searches group names and course values
        case-insensitively using partial-text matching.
        Otherwise, a non-blank course applies the exact-course filter.
        Without either filter, returns groups in randomized order.
        Returns at most 20 groups.
      parameters:
        - name: query
          in: query
          required: false
          description: Text to match against group name or course.
          schema:
            type: string
          example: backend
        - name: course
          in: query
          required: false
          description: |
            Exact-course filter retained for compatibility.
            Used only when query is missing or blank.
          schema:
            type: string
          example: CST438
      responses:
        '200':
          description: Matching groups, or an empty array.
          content:
            application/json:
              schema:
                type: array
                maxItems: 20
                items:
                  $ref: '#/components/schemas/StudyGroupSummary'
              examples:
                matchingGroups:
                  value:
                    - id: 1
                      name: CST438 Study Group
                      course: CST438
                      iconUrl: null
                      description: null
                noMatches:
                  value: []

    post:
      tags: [Groups]
      operationId: createStudyGroup
      summary: Create a study group
      description: |
        Requires an authenticated OAuth2 user whose email matches
        an existing StudyBuddy user.
        Creates the group and an OWNER membership for its creator
        in one transaction.
        Surrounding whitespace is trimmed before saving.
        Blank optional fields are stored as null.
        Bearer JWT authentication will follow in issue #19.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStudyGroupRequest'
            example:
              name: CST438 Study Group
              course: CST438
              description: Weekly backend study sessions.
      responses:
        '201':
          description: Group and owner membership created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyGroupSummary'
              example:
                id: 1
                name: CST438 Study Group
                course: CST438
                iconUrl: null
                description: Weekly backend study sessions.
        '400':
          description: |
            Missing request body, malformed JSON, missing or blank
            required fields, or values exceeding their length limits.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: |
            The authenticated user email is missing or does not
            match an existing StudyBuddy user.
            Unauthenticated requests may also be intercepted by
            the current OAuth2 security configuration.

components:
  schemas:
    CreateStudyGroupRequest:
      type: object
      description: |
        Length limits apply before trimming.
        Name and course must contain a non-whitespace character.
      required: [name, course]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '\S'
          example: CST438 Study Group
        course:
          type: string
          minLength: 1
          maxLength: 40
          pattern: '\S'
          example: CST438
        iconUrl:
          type: string
          nullable: true
          maxLength: 500
          description: Optional group icon URL.
        description:
          type: string
          nullable: true
          maxLength: 1000
          description: Optional group description.

    StudyGroupSummary:
      type: object
      description: Group fields returned by creation and search.
      required: [id, name, course]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 1
        name:
          type: string
          example: CST438 Study Group
        course:
          type: string
          example: CST438
        iconUrl:
          type: string
          nullable: true
          maxLength: 500
        description:
          type: string
          nullable: true
          maxLength: 1000

    Problem:
      type: object
      description: Problem Details response for invalid creation requests.
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri-reference
          example: about:blank
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          minimum: 400
          maximum: 599
          example: 400
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
          example: /groups